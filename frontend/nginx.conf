server_tokens off;

# Derrière un proxy HTTPS, on garde son en-tête ; sinon on prend le protocole reçu.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=()" always;

    # L'API : même adresse que l'application, donc pas de CORS.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Jamais mis en cache : une mise à jour de l'application doit être vue tout de suite.
    location = /index.html { expires -1; }
    location = /ngsw.json { expires -1; }
    location = /ngsw-worker.js { expires -1; }
    location = /manifest.webmanifest { expires -1; }

    # Fichiers à nom unique (le nom change quand le contenu change) : gardés un an.
    location ~* \.(js|css|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        try_files $uri =404;
    }

    # Toute autre adresse (/oeufs, /ventes…) : l'application Angular gère l'affichage.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
