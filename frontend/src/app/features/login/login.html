<main class="login">
  <section class="login__card glass" aria-labelledby="login-title">
    <div class="brand">
      <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
        <defs>
          <linearGradient id="avika-egg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffe9a8" />
            <stop offset="1" stop-color="#f2b33d" />
          </linearGradient>
        </defs>
        <path
          d="M24 4c8 0 15 13 15 23a15 15 0 0 1-30 0C9 17 16 4 24 4Z"
          fill="url(#avika-egg)"
        />
        <path
          d="M16 30c1 5 5 8 9 8"
          fill="none"
          stroke="#fff"
          stroke-opacity=".75"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
      <span class="brand__name">AVIKA</span>
    </div>

    <div class="login__intro">
      <h1 id="login-title">Connectez-vous à votre élevage</h1>
      <p>Suivez vos bandes, votre stock et votre trésorerie, même avec une connexion faible.</p>
    </div>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="identifier">E-mail ou téléphone</label>
        <input
          id="identifier"
          type="text"
          formControlName="identifier"
          autocomplete="username"
          autocapitalize="none"
          spellcheck="false"
        />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <div class="password">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password__toggle"
            [attr.aria-pressed]="showPassword()"
            (click)="showPassword.set(!showPassword())"
          >
            {{ showPassword() ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      @if (error(); as message) {
        <p class="login__error" role="alert">{{ message }}</p>
      }

      <button class="btn" type="submit" [disabled]="loading()">
        {{ loading() ? 'Connexion en cours…' : 'Se connecter' }}
      </button>
    </form>
  </section>
</main>
