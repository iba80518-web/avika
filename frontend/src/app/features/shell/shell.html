<div class="shell">
  <aside class="side">
    <div class="topbar glass">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="shell-egg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffe9a8" />
              <stop offset="1" stop-color="#f2b33d" />
            </linearGradient>
          </defs>
          <path d="M24 4c8 0 15 13 15 23a15 15 0 0 1-30 0C9 17 16 4 24 4Z" fill="url(#shell-egg)" />
        </svg>
        <span class="brand__name">AVIKA</span>
      </div>
      <button type="button" class="topbar__logout" (click)="logout()">Quitter</button>
    </div>

    <nav class="nav glass" aria-label="Navigation principale">
      @for (item of nav; track item.label) {
        @if (item.path; as path) {
          <a
            class="nav__item"
            [routerLink]="path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: path === '/' }"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
            <span>{{ item.label }}</span>
          </a>
        } @else {
          <span class="nav__item is-soon" aria-disabled="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="item.icon" /></svg>
            <span>{{ item.label }}</span>
          </span>
        }
      }
    </nav>

    <div class="me glass">
      <p class="me__farm">{{ organizationName() }}</p>
      <p class="me__name">{{ firstName() }} · {{ roleLabel() }}</p>
      <button type="button" class="btn btn--ghost" (click)="logout()">Se déconnecter</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
