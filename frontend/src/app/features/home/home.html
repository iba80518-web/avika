<main class="home">
  <section class="home__card glass">
    <p class="home__farm">{{ organizationName() }}</p>
    <h1>Bonjour {{ firstName() }}</h1>
    <p class="home__text">
      Vous êtes connecté comme {{ roleLabel() }}, avec {{ permissionCount() }} droits actifs.
    </p>
    <p class="home__text">Le tableau de bord arrive à l’étape suivante.</p>
    <button type="button" class="btn btn--ghost" (click)="logout()">Se déconnecter</button>
  </section>
</main>
