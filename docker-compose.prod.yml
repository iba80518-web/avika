# Production (test local ou serveur) : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  db:
    image: postgres:18
    env_file: .env.prod
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env.prod
    restart: unless-stopped
    volumes:
      - photos:/photos
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"

  web:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      - backend

volumes:
  pgdata:
  photos:
