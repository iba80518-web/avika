name: Tests

# Lance les contrôles à chaque envoi de code sur main et à chaque demande de fusion.
on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : ce workflow ne fait que lire le code.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgres:18
        env:
          POSTGRES_DB: avika
          POSTGRES_USER: avika
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U avika"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valeurs de test uniquement : aucun vrai secret n'est stocké dans ce fichier.
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret-key-for-tests-0123456789abcdef
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: avika
      POSTGRES_USER: avika
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérification de la configuration Django
        run: python manage.py check

      - name: Migrations à jour (aucun changement de modèle oublié)
        run: python manage.py makemigrations --check --dry-run

      - name: Tests
        run: python manage.py test --verbosity 1
